<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO:start --><!-- SEO:end -->
    <meta name="author" content="Emil Berglund" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#12160f" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#e9ebe2" media="(prefers-color-scheme: light)" />

    <script id="initial-theme">
      (() => {
        let preference = null
        try {
          if (localStorage.getItem('cookie-consent') === 'accepted') preference = localStorage.getItem('theme')
        } catch { /* Storage may be unavailable; use the system appearance. */ }
        const light = preference === 'light' || (preference !== 'dark' && window.matchMedia('(prefers-color-scheme: light)').matches)
        document.documentElement.classList.toggle('light', light)
        document.documentElement.classList.toggle('dark', !light)
      })()
    </script>
    <style id="initial-theme-style">
      html { background: #12160f; color: #eceee2; color-scheme: dark; }
      html.light { background: #e9ebe2; color: #1e241c; color-scheme: light; }
      body { margin: 0; }
    </style>
    <link rel="stylesheet" href="/src/index.css" />

    <link rel="preload" href="/fonts/bricolage-grotesque-normal-latin.woff2" as="font" type="font/woff2" crossorigin />

    <link rel="icon" type="image/png" sizes="256x256" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

  </head>
  <body>
    <div id="root"><!-- CONTENT:start --><!-- CONTENT:end --></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
